<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reproduction #9 · create/edit modal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     TOKENS — a create/edit MODAL over a dimmed app. Reproduced from
     a study of a real shipped link-in-bio tool. This validates the
     overlay shell the command-palette cookbook named: scrim + centered
     floating surface + shadow (§6 — it floats, so it earns the shadow).
     The modal-specific layer on top: a form (field-type select, a
     labeled input with a char COUNTER, a CHOICES repeater with drag +
     delete + "add another"), a multi-step STACK (the prior step peeks
     behind), and a full-width primary action. One accent (§4), here a
     lavender→violet, used on the Save, the add-link, and the radio.
     ============================================================ */
  :root {
    --app-bg:  #f4f4f6;
    --scrim:   rgba(20,18,28,.55);
    --card:    #ffffff;
    --back:    #ffffff;          /* the stacked previous-step card */
    --line:    #e7e8ec;
    --field:   #f3f3f5;          /* input fill */
    --field-ln:#e6e7ea;
    --ink:     #1d1f24;
    --muted:   #6c7079;
    --faint:   #a2a7b0;
    --acc-1:   #b794f6;
    --acc-2:   #8b5cf6;          /* violet */
    --acc-ink: #8129d9;          /* add-link + radio + counter-ish */

    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font); -webkit-font-smoothing: antialiased; color: var(--ink); }
  .viewport { position: relative; width: 1280px; height: 800px; overflow: hidden; background: var(--app-bg); }

  /* ---- dimmed app behind ---- */
  .appbg { position: absolute; inset: 0; display: grid; grid-template-columns: 200px 1fr 300px; opacity: .9; }
  .appbg .sb { background: #fbfbfc; border-right: 1px solid #ededf0; padding: 16px 14px; }
  .appbg .sb .b { height: 26px; border-radius: 7px; background: #f0f0f3; margin-bottom: 8px; }
  .appbg .sb .b.s { width: 70%; height: 11px; background: #f2f2f4; }
  .appbg .main { padding: 20px 28px; }
  .appbg .main .h { height: 16px; width: 90px; border-radius: 5px; background: #e9e9ec; margin-bottom: 24px; }
  .appbg .main .card { height: 70px; border: 1px solid #ededf0; border-radius: 12px; background: #fff; margin-bottom: 14px; }
  .appbg .ph { margin: 24px; border-radius: 28px; background: #1a1a1f; }

  .scrim { position: absolute; inset: 0; background: var(--scrim); }

  /* ---- the modal stack ---- */
  .modal-wrap { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); width: 472px; }
  /* the prior-step card peeking behind */
  .back-card { position: absolute; top: -22px; left: 16px; right: 16px; height: 70px; background: var(--back); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 16px -8px rgba(20,18,28,.25); opacity: .7; display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; }
  .back-card .bt { font-size: 14px; font-weight: 600; color: var(--muted); }
  .back-card .ba { position: absolute; left: 18px; top: 11px; color: var(--faint); }

  .modal { position: relative; background: var(--card); border-radius: 22px; box-shadow: 0 30px 70px -18px rgba(20,18,28,.5), 0 12px 28px -12px rgba(20,18,28,.4); padding: 24px 28px 28px; }
  .mhead { display: flex; align-items: center; justify-content: center; position: relative; margin-bottom: 24px; }
  .mhead .ba { position: absolute; left: 0; color: var(--muted); }
  .mhead .t { font-size: 16px; font-weight: 600; }
  .mhead .x { position: absolute; right: 0; color: var(--muted); display: grid; place-items: center; }

  .flabel { font-size: 13.5px; font-weight: 600; color: var(--ink); margin: 0 0 8px; }
  .group { margin-bottom: 20px; }
  .select { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; background: var(--field); border: 1px solid var(--field-ln); border-radius: 11px; }
  .radio { width: 17px; height: 17px; border-radius: 50%; border: 5px solid var(--acc-ink); background: #fff; box-shadow: inset 0 0 0 1px var(--acc-ink); flex: 0 0 auto; }
  .select .sv { font-size: 14px; color: var(--ink); flex: 1; }
  .select .cv { color: var(--muted); }

  .input { height: 46px; padding: 0 14px; background: var(--field); border: 1px solid var(--field-ln); border-radius: 11px; display: flex; align-items: center; font-size: 14px; color: var(--ink); }
  .counter { text-align: right; font-size: 12px; color: var(--faint); margin-top: 8px; }

  .choice { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .drag { color: #c4c7cd; flex: 0 0 auto; cursor: grab; }
  .choice .input { flex: 1; }
  .choice .input.empty { color: var(--faint); }
  .trash { color: #b3b7bf; flex: 0 0 auto; display: grid; place-items: center; }
  .addopt { color: var(--acc-ink); font-size: 13.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin: 2px 0 24px; }

  .save { height: 52px; border-radius: 26px; background: linear-gradient(180deg, var(--acc-1), var(--acc-2)); display: grid; place-items: center; font-size: 15px; font-weight: 600; color: #fff; opacity: .92; }
</style>
</head>
<body>
  <div class="viewport">
    <!-- dimmed app behind -->
    <div class="appbg">
      <div class="sb">
        <div class="b s" style="width:50%;margin-bottom:20px"></div>
        <div class="b"></div><div class="b"></div><div class="b"></div>
        <div class="b s" style="margin:20px 0 8px"></div>
        <div class="b"></div><div class="b"></div><div class="b"></div>
      </div>
      <div class="main">
        <div class="h"></div>
        <div class="card"></div><div class="card"></div><div class="card" style="height:120px"></div>
      </div>
      <div class="ph"></div>
    </div>
    <div class="scrim"></div>

    <!-- modal stack -->
    <div class="modal-wrap">
      <!-- previous step, peeking behind -->
      <div class="back-card">
        <span class="ba"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></span>
        <span class="bt">Add field</span>
      </div>

      <div class="modal">
        <div class="mhead">
          <span class="t">Add field</span>
          <span class="x"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
        </div>

        <div class="group">
          <div class="flabel">Field Type</div>
          <div class="select">
            <span class="radio"></span>
            <span class="sv">Single choice</span>
            <span class="cv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></span>
          </div>
        </div>

        <div class="group" style="margin-bottom:20px">
          <div class="flabel">Label</div>
          <div class="input">Design Scope</div>
          <div class="counter">12/200</div>
        </div>

        <div class="flabel">Choices</div>
        <div class="choice">
          <span class="drag"><svg width="14" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
          <div class="input">Interior</div>
          <span class="trash"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/></svg></span>
        </div>
        <div class="choice">
          <span class="drag"><svg width="14" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg></span>
          <div class="input empty">&nbsp;</div>
          <span class="trash"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M10 7V5h4v2M8 7l1 12h6l1-12"/></svg></span>
        </div>
        <div class="addopt"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> Add another option</div>

        <div class="save">Save</div>
      </div>
    </div>
  </div>
</body>
</html>
