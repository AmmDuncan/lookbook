document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

andidate.md)\n   Distilled from a study of real shipped products at their app surfaces.\n   This is the ONE foundation every cool-technical molecule consumes. Coherence\n   is free because no molecule hardcodes a value that belongs here.\n   NOTE: molecule TREATMENTS (row heights, chart fills, status chroma) are\n   grounded by live measurement in Phase 2 and may refine the *-craft vars below.\n   ============================================================================ */\n:root {\n  /* — palette: cool-slate neutral ramp (tinted, never pure gray) + off-axis indigo accent — */\n  --bg:        #F7F8F9;   /* off-white, never #FFF (AD-6) */\n  --surface:   #FFFFFF;\n  --border:    #E8EAED;   /* hairline separator — the primary divider (AD-9/MC-1) */\n  --border-strong: #D6DAE0; /* checkbox/radio/toggle edges — a half-step up from --border */\n  --ink:       #16181D;   /* near-black w/ cool undertone, never #000 (AD-6) */\n  --muted:     #6B7280;\n  --subtle:    #838A95;   /* faint tier — icon strokes, dots, faint labels. Meets 3:1 (3.27 bg / 3.48 surface).\n                            Readable body/small text (nav labels, table headers, axis) still uses --muted. */\n\n  --accent:        #5B5BD6;             /* indigo-violet, off the default blue/indigo axis (AD-1/2a) */\n  --accent-ink:    #4A4AC4;             /* pressed/ink step */\n  --accent-tint:   rgba(91,91,214,0.07);/* hand-tuned 7% tint for selected rows, not green-50 */\n\n  --positive:  #1A7F4B;\n  --warning:   #92600A;   /* amber-700: passes 4.5:1 as text on surface/bg (was #B7791F=3.64 fail) */\n  --danger:    #C8412E;\n\n  /* — type: ONE deliberate technical face (Geist), differentiated by the type SCALE below\n       (--t-display/--t-body weight+size+tracking), not a second family — the Vercel/Linear\n       product-register pattern (P-AS-03). NB: the HTML must actually LOAD Geist (Google Fonts);\n       a declared-but-unloaded face silently falls back to Inter = the lazy \"Inter-everywhere\"\n       tell (AD-5). — */\n  --font-ui:      'Geist', 'Inter', system-ui, sans-serif;\n  --font-display: 'Geist', 'Inter', system-ui, sans-serif;\n  --font-mono:    'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;\n\n  /* registers (size / weight / tracking) */\n  --t-display:   600 32px/1.15 var(--font-display);   /* page title; tracking via --tr-display */\n  --tr-display:  -0.025em;\n  --t-h:         600 16px/1.3  var(--font-ui);\n  --t-body:      400 14px/1.5  var(--font-ui);\n  --t-eyebrow:   600 11px/1    var(--font-ui);         /* uppercase + --tr-eyebrow */\n  --tr-eyebrow:  0.07em;\n  --t-figure:    600 40px/1.05 var(--font-display);    /* big number; tabular + --tr-figure */\n  --tr-figure:   -0.02em;\n  --t-caption:   500 12px/1.3  var(--font-ui);\n\n  /* — craft: one radius family, hairline borders, tight rows, fast small motion — */\n  --radius:      7px;       /* 6–8px family, confident not bubbly (MC-3) */\n  --radius-lg:   11px;      /* large surfaces only */\n  --border-w:    1px;\n  --row-h:       38px;      /* tight admin row (MC-2) — PHASE-2 measure to confirm */\n  --topbar-h:    52px;      /* SHARED SEAM: rail brand-header AND topbar both use this so\n                               their bottom borders form ONE continuous line across the shell */\n  --page-pad:    40px;      /* generous frame (MC-6) */\n  --motion:      140ms; /* @kind other */\n  --ease:        cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n\n  /* — accent deployment budget: ≤4 instances/screen (2a). Tracked by discipline, not code. — */\n}\n\n/* dark register (kept for completeness; MVP renders light) */\n:root[data-theme=\"dark\"] {\n  --bg:      #0E0F13;\n  --surface: #16181D;\n  --border:  #24262C;\n  --ink:     #ECEDEF;\n  --muted:   #8A909B;\n  --subtle:  #6A7079;   /* faint tier — meets 3:1 on dark (3.84 bg / 3.56 surface) */\n}\n\n/* tabular numerals helper — every figure/number register opts in (T-1) */\n.tnum { font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n  <style>/* ============================================================================\n   Lookbook Specimens — root stylesheet\n   Single entry point so consumers link ONE file. Each register's token\n   foundation is imported below; molecules in each kit consume its tokens.\n   The three registers share the brand-continuous indigo accent (#5B5BD6)\n   and diverge on type / density / texture (the cardinal rule).\n   ============================================================================ */\n/* ============================================================================\n   Lookbook Specimens — @font-face foundation\n   Wires the user-uploaded voice fonts (uploads/lookbook-voice-fonts/) to the\n   family names the register tokens reference. Imported first by styles.css so\n   the faces are available across every kit's token closure.\n   NOTE: 'Fraunces' (warm-editorial --font-display) is not yet uploaded; until\n   it is, that token renders via its Georgia/serif fallback stack.\n   ============================================================================ */\n\n/* — Geist (cool-technical --font-ui/--font-display, marketing --font-sans) — */\n@font-face{font-family:'Geist';font-style:normal;font-weight:400;font-display:swap;src:url(\"3f5a1956-4edb-47aa-8050-1fe84f52727c\") format('woff2');}\n@font-face{font-family:'Geist';font-style:normal;font-weight:500;font-display:swap;src:url(\"33c2c7cc-2776-49e5-b770-8eb58cf54c62\") format('woff2');}\n@font-face{font-family:'Geist';font-style:normal;font-weight:600;font-display:swap;src:url(\"8880b909-7918-41a7-bd82-a375db104857\") format('woff2');}\n@font-face{font-family:'Geist';font-style:normal;font-weight:700;font-display:swap;src:url(\"5395a9e3-cf3d-463f-a491-d5afdd1dca74\") format('woff2');}\n\n/* — Geist Mono (cool-technical + marketing --font-mono) — */\n@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;font-display:swap;src:url(\"444bc7f0-1d30-4a2d-9611-579338eb941e\") format('woff2');}\n@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;font-display:swap;src:url(\"12d6d819-c5bd-4c37-90de-7b645f08dc6a\") format('woff2');}\n@font-face{font-family:'Geist Mono';font-style:normal;font-weight:600;font-display:swap;src:url(\"a1801fd5-e079-41ea-b8f5-a78b9930fb7f\") format('woff2');}\n\n/* — Bricolage Grotesque (marketing --font-display) — */\n@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:400;font-display:swap;src:url(\"da45b604-e9fe-4e9d-8660-4278c1531cec\") format('woff2');}\n@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500;font-display:swap;src:url(\"b68ffb93-e833-4103-9c91-d4d0616928a8\") format('woff2');}\n@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600;font-display:swap;src:url(\"783f41cf-ba42-4d26-aa98-b62be75b89ec\") format('woff2');}\n@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:700;font-display:swap;src:url(\"36e21b69-eba2-42c9-9d59-4352c8b0e03c\") format('woff2');}\n@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:800;font-display:swap;src:url(\"088676e4-fd6e-4853-b0df-7d842f948893\") format('woff2');}\n\n/* — Lora (warm-editorial --font-body) — */\n@font-face{font-family:'Lora';font-style:normal;font-weight:400;font-display:swap;src:url(\"70ae388b-f1a2-4972-a2e2-61c070cc63fb\") format('woff2');}\n@font-face{font-family:'Lora';font-style:italic;font-weight:400;font-display:swap;src:url(\"f7e971d2-e16b-4392-bb1c-73e792168f90\") format('woff2');}\n@font-face{font-family:'Lora';font-style:normal;font-weight:500;font-display:swap;src:url(\"8ccab15c-f421-4510-adb6-239de09a1604\") format('woff2');}\n@font-face{font-family:'Lora';font-style:normal;font-weight:600;font-display:swap;src:url(\"031510b6-706d-4c93-a24f-8b0021c88141\") format('woff2');}\n@font-face{font-family:'Lora';font-style:normal;font-weight:700;font-display:swap;src:url(\"f026c795-c2b2-4488-9484-a93cbdc460b1\") format('woff2');}\n\n/* ============================================================================\n   COOL-TECHNICAL register — shared token foundation (the coherence layer)\n   Source: Specimen A (\"Cool-technical dashboard\", taste-rules-candidate.md)\n   Distilled from a study of real shipped products at their app surfaces.\n   This is the ONE foundation every cool-technical molecule consumes. Coherence\n   is free because no molecule hardcodes a value that belongs here.\n   NOTE: molecule TREATMENTS (row heights, chart fills, status chroma) are\n   grounded by live measurement in Phase 2 and may refine the *-craft vars below.\n   ============================================================================ */\n:root {\n  /* — palette: cool-slate neutral ramp (tinted, never pure gray) + off-axis indigo accent — */\n  --bg:        #F7F8F9;   /* off-white, never #FFF (AD-6) */\n  --surface:   #FFFFFF;\n  --border:    #E8EAED;   /* hairline separator — the primary divider (AD-9/MC-1) */\n  --border-strong: #D6DAE0; /* checkbox/radio/toggle edges — a half-step up from --border */\n  --ink:       #16181D;   /* near-black w/ cool undertone, never #000 (AD-6) */\n  --muted:     #6B7280;\n  --subtle:    #838A95;   /* faint tier — icon strokes, dots, faint labels. Meets 3:1 (3.27 bg / 3.48 surface).\n                            Readable body/small text (nav labels, table headers, axis) still uses --muted. */\n\n  --accent:        #5B5BD6;             /* indigo-violet, off the default blue/indigo axis (AD-1/2a) */\n  --accent-ink:    #4A4AC4;             /* pressed/ink step */\n  --accent-tint:   rgba(91,91,214,0.07);/* hand-tuned 7% tint for selected rows, not green-50 */\n\n  --positive:  #1A7F4B;\n  --warning:   #92600A;   /* amber-700: passes 4.5:1 as text on surface/bg (was #B7791F=3.64 fail) */\n  --danger:    #C8412E;\n\n  /* — type: ONE deliberate technical face (Geist), differentiated by the type SCALE below\n       (--t-display/--t-body weight+size+tracking), not a second family — the Vercel/Linear\n       product-register pattern (P-AS-03). NB: the HTML must actually LOAD Geist (Google Fonts);\n       a declared-but-unloaded face silently falls back to Inter = the lazy \"Inter-everywhere\"\n       tell (AD-5). — */\n  --font-ui:      'Geist', 'Inter', system-ui, sans-serif;\n  --font-display: 'Geist', 'Inter', system-ui, sans-serif;\n  --font-mono:    'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;\n\n  /* registers (size / weight / tracking) */\n  --t-display:   600 32px/1.15 var(--font-display);   /* page title; tracking via --tr-display */\n  --tr-display:  -0.025em;\n  --t-h:         600 16px/1.3  var(--font-ui);\n  --t-body:      400 14px/1.5  var(--font-ui);\n  --t-eyebrow:   600 11px/1    var(--font-ui);         /* uppercase + --tr-eyebrow */\n  --tr-eyebrow:  0.07em;\n  --t-figure:    600 40px/1.05 var(--font-display);    /* big number; tabular + --tr-figure */\n  --tr-figure:   -0.02em;\n  --t-caption:   500 12px/1.3  var(--font-ui);\n\n  /* — craft: one radius family, hairline borders, tight rows, fast small motion — */\n  --radius:      7px;       /* 6–8px family, confident not bubbly (MC-3) */\n  --radius-lg:   11px;      /* large surfaces only */\n  --border-w:    1px;\n  --row-h:       38px;      /* tight admin row (MC-2) — PHASE-2 measure to confirm */\n  --topbar-h:    52px;      /* SHARED SEAM: rail brand-header AND topbar both use this so\n                               their bottom borders form ONE continuous line across the shell */\n  --page-pad:    40px;      /* generous frame (MC-6) */\n  --motion:      140ms; /* @kind other */\n  --ease:        cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n\n  /* — accent deployment budget: ≤4 instances/screen (2a). Tracked by discipline, not code. — */\n}\n\n/* dark register (kept for completeness; MVP renders light) */\n:root[data-theme=\"dark\"] {\n  --bg:      #0E0F13;\n  --surface: #16181D;\n  --border:  #24262C;\n  --ink:     #ECEDEF;\n  --muted:   #8A909B;\n  --subtle:  #6A7079;   /* faint tier — meets 3:1 on dark (3.84 bg / 3.56 surface) */\n}\n\n/* tabular numerals helper — every figure/number register opts in (T-1) */\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ============================================================================\n   WARM-EDITORIAL register — shared token foundation (the coherence layer)\n   A surface that READS — long-form, considered, print-derived. The third register:\n   not data/app (cool-technical), not convince/landing (marketing), but EDITORIAL.\n   Dials from the brain's editorial column (identity.md / P-AP-05): near-neutral WARM,\n   AIRY, LOW radius, RESTRAINED shadow (rules carry structure, not shadows), serif\n   display, slow fades.\n\n   TYPE VOICE (user-picked 2026-06-01, easel #57 → hybrid): Fraunces DISPLAY + Lora BODY.\n     Two SERIF families — both open/warm. Fraunces (soft, optical) carries headlines +\n     uppercase kickers; Lora (open, bookish) carries deck/body/caption/byline. No sans:\n     the all-serif pairing IS the register's distinctiveness (the other two are sans-bodied).\n     Cap of two families per screen holds (P-ID-04). HTML must LOAD both (Google Fonts).\n   ACCENT: brand-continuous indigo #5B5BD6 — the Lookbook family converges on the palette\n     and diverges on type/density/texture (the cardinal rule). Editorial spends it the most\n     SCARCELY of the three registers: links, one kicker, one rule — ink does the rest.\n   Distilled from a study of real shipped editorial/long-form products.\n   ============================================================================ */\n:root {\n  /* — palette: warm paper + warm ink, accent kept scarce — */\n  --paper:     #FBF9F4;   /* warm cream reading ground — never #FFF; editorial reads ON the paper */\n  --surface:   #FFFFFF;   /* the rare card / pull-out — a half-step brighter than paper */\n  --rule:      #E5DFD4;   /* warm hairline — the editorial workhorse (section rules, dividers) */\n  --rule-strong: #D8CFBF;\n  --ink:       #1F1B17;   /* warm near-black, the body ink — never #000 */\n  --muted:     #6E665C;   /* secondary (deck, byline, caption) — 5.6:1 on paper (AA) */\n  --subtle:    #A89F90;   /* DECORATIVE ONLY (dinkus, hairline marks): ~2.7:1 — never readable text */\n\n  --accent:        #5B5BD6;              /* indigo — fills / the one mark; white text 5.37:1 (F66) */\n  --accent-ink:    #4A4AC4;              /* link TEXT step — 6.85:1 on surface, passes on paper too */\n  --accent-tint:   rgba(91,91,214,0.07); /* the rare spot tint */\n\n  --positive:  #2F7D52;\n  --critical:  #B23B2E;\n\n  /* — type: Fraunces DISPLAY + Lora BODY (the all-serif editorial pairing) — */\n  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-body:    'Lora', Georgia, serif;\n\n  /* registers (size / weight / tracking) — generous editorial scale */\n  --t-hero:      600 56px/1.04 var(--font-display); --tr-hero: -0.02em;   /* article masthead 48–64 */\n  --t-title:     600 38px/1.1  var(--font-display); --tr-title: -0.015em; /* section / index headline */\n  --t-h:         600 26px/1.25 var(--font-display);                       /* sub-head inside prose */\n  --t-kicker:    600 12.5px/1  var(--font-display); --tr-kicker: 0.16em;  /* uppercase category/eyebrow */\n  --t-deck:      400 21px/1.5  var(--font-body);                          /* standfirst / deck (Lora) */\n  --t-body:      400 19px/1.72 var(--font-body);                          /* long-form body — the reading size */\n  --t-caption:   400 14px/1.5  var(--font-body);                          /* figure caption / credit */\n  --t-byline:    500 14.5px/1.3 var(--font-body);                         /* author + meta row */\n\n  /* — craft: LOW radius (print feel), RESTRAINED depth (rules not shadows) — */\n  --radius:      3px;       /* near-square — editorial is print-derived, not app-rounded */\n  --radius-lg:   4px;\n  --border-w:    1px;\n\n  --measure:     66ch;      /* reading width (60–72ch) — the spine of an editorial layout */\n  --content-max: 1180px;    /* index / wide-figure outer bound */\n  --gutter:      40px;\n\n  --section-gap: 88px;      /* airy: between major article sections */\n  --flow:        24px;      /* vertical rhythm between prose blocks (paragraphs use a tighter step) */\n\n  --motion:      280ms; /* @kind other */\n  --ease:        cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n\n  /* — depth: editorial earns almost none — one soft shadow for the rare floating card — */\n  --shadow-sm:    0 1px 2px rgba(31,27,23,.05);\n  --shadow-card:  0 18px 40px -24px rgba(31,27,23,.20);\n\n  /* — texture: editorial allows ONE restrained ornament per surface (a rule, a dinkus,\n       a drop-cap) — never a pattern wash. The dinkus (· · ·) marks a scene break. — */\n}\n\n/* old-style figures for running prose; tabular only where numbers align (rare in editorial) */\n.onum { font-variant-numeric: oldstyle-nums proportional-nums; }\n.tnum { font-variant-numeric: tabular-nums; }\n\n/* ============================================================================\n   MARKETING register — shared token foundation (the coherence layer)\n   The deliberate OPPOSITE of cool-technical: spacious (not dense), a real\n   display+sans PAIRING (not single-family), texture ALLOWED (not banned).\n   Surface intent: convince, not operate (patterns/marketing.md P-M).\n\n   TYPE VOICE (user-picked 2026-05-31, easel #43): Bricolage Grotesque display\n     + Geist body — one display + one sans (P-M-08 / P-AS-03). Bricolage carries\n     the voice on hero + section titles; Geist stays neutral for deck/body/UI.\n     The HTML must LOAD both (Google Fonts) — a declared-but-unloaded face\n     silently falls back (the lazy \"Inter-everywhere\" tell, P-AS-03).\n   ACCENT: brand-continuous indigo #5B5BD6 (same as cool-technical) — the\n     Lookbook family converges on the palette + diverges on type/density/texture\n     (the cardinal rule). White text on it = 5.37:1 AA (verified, F66/P-ID-02).\n   Distilled from a study of real shipped marketing/pricing sites.\n   ============================================================================ */\n:root {\n  /* — palette: warm-paper neutral ramp + brand-continuous indigo accent — */\n  --bg:        #FAF9F7;   /* warm paper off-white, never #FFF (F20) */\n  --surface:   #FFFFFF;\n  --border:    #E9E6E0;   /* warm hairline separator (F21) */\n  --border-strong: #D8D3CA;\n  --ink:       #1A1A1F;   /* near-black, warm undertone, never #000 */\n  --muted:     #6B6B72;   /* readable secondary text — 5.03:1 on --bg (AA) */\n  --subtle:    #9A968E;   /* DECORATIVE ONLY (dots, hairline marks): 2.80:1 — never readable text.\n                            Readable small/uppercase text uses --muted. */\n\n  --accent:        #5B5BD6;              /* indigo — white text passes 5.37:1 (F66) */\n  --accent-ink:    #4A4AC4;              /* hover/pressed step (white text 6.85:1) */\n  --accent-tint:   rgba(91,91,214,0.08); /* selected/spot tint */\n  --accent-faint:  rgba(91,91,214,0.05); /* atmospheric wash only */\n  --accent-band:   #EFEEF7;              /* PERCEPTIBLE section-tint band for P-M-16 rhythm —\n                                            the 5% --accent-faint wash is invisible against warm paper;\n                                            this soft cool-indigo reads as a distinct band at a glance. */\n\n  --positive:  #1A7F4B;\n  --warning:   #92600A;\n  --danger:    #C8412E;\n\n  /* — code/terminal palette: token-derived so a dev-product code block isn't invented per build\n       (the marketing hero product-visual is product-type-fit — dashboard / terminal / code / device). — */\n  --code-bg:      #0F1117;\n  --code-fg:      #E6EDF3;\n  --code-comment: #8A93A6;\n  --code-keyword: #A6A6F2;   /* indigo-violet — ties to --accent */\n  --code-string:  #9ECE6A;\n  --code-number:  #E0A36B;\n  --code-func:    #7AA2F7;\n\n  /* — type: Bricolage Grotesque DISPLAY + Geist SANS (the marketing pairing, P-M-08) — */\n  --font-display: 'Bricolage Grotesque', 'Geist', system-ui, sans-serif;\n  --font-sans:    'Geist', 'Inter', system-ui, sans-serif;\n  --font-mono:    'Geist Mono', ui-monospace, monospace;\n\n  /* registers (size / weight / tracking) — spacious marketing scale (P-M-01/02) */\n  --t-hero:      600 64px/1.06 var(--font-display);  /* hero headline 44–96px; tracking --tr-hero */\n  --tr-hero:     -0.028em;\n  --t-display:   600 40px/1.1  var(--font-display);  /* section title; tracking --tr-display */\n  --tr-display:  -0.025em;\n  --t-h:         600 24px/1.25 var(--font-display);  /* sub-section heading */\n  --t-eyebrow:   600 13px/1    var(--font-sans);     /* uppercase + --tr-eyebrow (P-M-02) */\n  --tr-eyebrow:  0.13em;\n  --t-deck:      400 20px/1.55 var(--font-sans);     /* sub-headline deck (P-M-02: 18–24px) */\n  --t-body:      400 16px/1.6  var(--font-sans);     /* body copy (F3) */\n  --t-caption:   500 13px/1.4  var(--font-sans);\n\n  /* — craft: spacious frame, confident radius, real depth on product visuals — */\n  --radius:      10px;\n  --radius-lg:   16px;      /* large surfaces / product frames */\n  --radius-pill: 999px;     /* CTAs / chips */\n  --border-w:    1px;\n\n  --content-max: 1180px;    /* inner section content (P-M: 1080–1200px) */\n  --prose-max:   68ch;      /* reading width (P-M-11: 60–75ch) */\n  --section-pad: 112px;     /* desktop section padding (P-M: 96–160px) */\n  --section-pad-sm: 64px;   /* mobile (P-M / F11 ceiling) */\n\n  --motion:      200ms; /* @kind other */\n  --ease:        cubic-bezier(0.2, 0, 0, 1); /* @kind other */\n\n  /* — depth: marketing EARNS shadow on product visuals (P-M-13); product surfaces don't — */\n  --shadow-sm:    0 1px 2px rgba(26,26,31,.06);\n  --shadow-card:  0 12px 30px -18px rgba(26,26,31,.16), 0 2px 8px -4px rgba(26,26,31,.08);\n  --shadow-float: 0 40px 80px -32px rgba(26,26,31,.24), 0 12px 28px -16px rgba(26,26,31,.14);\n\n  /* — texture: ALLOWED on marketing, one per section max (P-M-05, F35 atmospheric family).\n       An indigo-tinted atmospheric glow for the ONE hero band — never on cards/atoms. — */\n  --atmos: radial-gradient(60% 50% at 50% 0%, var(--accent-faint), transparent 70%);\n\n  /* — accent budget: 3–5 instances/page, concentrated at CTAs (P-M-10). Tracked by discipline. — */\n}\n\n/* tabular numerals helper — figures opt in */\n.tnum { font-variant-numeric: tabular-nums; }\n\n<\u002Fstyle>\n  <script src=\"ac33fadd-ad93-41f7-8036-006e3c8759e3\"><\u002Fscript>\n  <style>\n    body{margin:0}\n    .tnum{font-variant-numeric:tabular-nums}\n    ::-webkit-scrollbar{height:8px;width:8px}\n    ::-webkit-scrollbar-thumb{background:#D6DAE0;border-radius:8px}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-grid\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"7\" height=\"7\" x=\"3\" y=\"3\" rx=\"1\"><\u002Frect><rect width=\"7\" height=\"7\" x=\"14\" y=\"3\" rx=\"1\"><\u002Frect><rect width=\"7\" height=\"7\" x=\"14\" y=\"14\" rx=\"1\"><\u002Frect><rect width=\"7\" height=\"7\" x=\"3\" y=\"14\" rx=\"1\"><\u002Frect><\u002Fsymbol>\n  <symbol id=\"i-list\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 5h.01\"><\u002Fpath><path d=\"M3 12h.01\"><\u002Fpath><path d=\"M3 19h.01\"><\u002Fpath><path d=\"M8 5h13\"><\u002Fpath><path d=\"M8 12h13\"><\u002Fpath><path d=\"M8 19h13\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-rows\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"><\u002Frect><path d=\"M3 9h18\"><\u002Fpath><path d=\"M3 15h18\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-table\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\"><\u002Frect><path d=\"M3 9h18\"><\u002Fpath><path d=\"M3 15h18\"><\u002Fpath><path d=\"M12 3v18\"><\u002Fpath><\u002Fsymbol>\n  <symbol id=\"i-search\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21 21-4.34-4.34\"><\u002Fpath><circle cx=\"11\" cy=\"11\" r=\"8\"><\u002Fcircle><\u002Fsymbol>\n  <symbol id=\"i-dots\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"1\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1\"><\u002Fcircle><circle cx=\"5\" cy=\"12\" r=\"1\"><\u002Fcircle><\u002Fsymbol>\n  <symbol id=\"i-car\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2\"><\u002Fpath><circle cx=\"7\" cy=\"17\" r=\"2\"><\u002Fcircle><path d=\"M9 17h6\"><\u002Fpath><circle cx=\"17\" cy=\"17\" r=\"2\"><\u002Fcircle><\u002Fsymbol>\n  <symbol id=\"i-shield\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z\"><\u002Fpath><\u002Fsymbol>\n<\u002Fsvg>\n\n<div style=\"background:var(--bg);min-height:100vh;font-family:var(--font-ui);color:var(--ink);-webkit-font-smoothing:antialiased;padding:48px 40px 72px\">\n<div style=\"max-width:1140px;margin:0 auto\">\n\n  <!-- ============ PAGE HEADER ============ -->\n  <header style=\"display:flex;align-items:flex-start;gap:18px;padding-bottom:26px;border-bottom:1px solid var(--border)\">\n    <div style=\"width:44px;height:44px;border-radius:11px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px\"><svg width=\"22\" height=\"22\"><use href=\"#i-shield\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n    <div style=\"flex:1\">\n      <div style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--subtle)\">DVLA · Vehicle registration admin — specimen sheet<\u002Fdiv>\n      <h1 style=\"font:var(--t-display);letter-spacing:var(--tr-display);margin:9px 0 0\">View-Mode &amp; Density Studies<\u002Fh1>\n      <p style=\"font-size:14.5px;line-height:1.55;color:var(--muted);max-width:740px;margin:11px 0 0;text-wrap:pretty\">One dataset of ten vehicle records, rendered seven ways — four view modes and three table densities — to weigh the same trade-off in each: how much richness per record against how many records on screen.<\u002Fp>\n      <div style=\"display:flex;gap:8px;margin-top:16px;flex-wrap:wrap\">\n        <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\"><span style=\"width:6px;height:6px;border-radius:50%;background:var(--accent)\"><\u002Fspan>10 records · identical<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:500;color:var(--muted);padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\">4 view modes<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:500;color:var(--muted);padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\">3 table densities<\u002Fspan>\n        <span style=\"font-size:12px;font-weight:500;color:var(--muted);padding:5px 11px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)\">Cool-technical kit<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ PART A ============ -->\n  <div style=\"display:flex;align-items:baseline;gap:14px;margin:46px 0 6px\">\n    <span style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--accent-ink);background:var(--accent-tint);padding:4px 9px;border-radius:6px\">Part A<\u002Fspan>\n    <h2 style=\"font-size:21px;font-weight:600;letter-spacing:-0.015em;margin:0\">View modes<\u002Fh2>\n    <span style=\"color:var(--subtle);font-size:13.5px\">— the same records, four renders<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- view toggle -->\n  <div style=\"display:flex;align-items:center;gap:16px;margin:18px 0 30px;padding:13px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);flex-wrap:wrap\">\n    <span style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted)\">View switcher<\u002Fspan>\n    <div style=\"display:inline-flex;gap:3px;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:9px\">\n      <button style=\"{{ seg.card }}\" onclick=\"{{ setView.card }}\"><svg width=\"15\" height=\"15\"><use href=\"#i-grid\"><\u002Fuse><\u002Fsvg>Card grid<\u002Fbutton>\n      <button style=\"{{ seg.list }}\" onclick=\"{{ setView.list }}\"><svg width=\"15\" height=\"15\"><use href=\"#i-list\"><\u002Fuse><\u002Fsvg>List rows<\u002Fbutton>\n      <button style=\"{{ seg.compact }}\" onclick=\"{{ setView.compact }}\"><svg width=\"15\" height=\"15\"><use href=\"#i-rows\"><\u002Fuse><\u002Fsvg>Compact<\u002Fbutton>\n      <button style=\"{{ seg.table }}\" onclick=\"{{ setView.table }}\"><svg width=\"15\" height=\"15\"><use href=\"#i-table\"><\u002Fuse><\u002Fsvg>Table<\u002Fbutton>\n    <\u002Fdiv>\n    <span style=\"margin-left:auto;color:var(--subtle);font-size:12.5px\">Switch the render — the data is held identical<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- A1 · CARD GRID -->\n  <section style=\"margin-bottom:34px\">\n    <div style=\"display:flex;gap:13px;align-items:flex-start;margin-bottom:14px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:3px 8px;border-radius:6px\">A1<\u002Fspan>\n      <div style=\"flex:1\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><h3 style=\"font-size:16.5px;font-weight:600;letter-spacing:-0.01em;margin:0\">Card grid<\u002Fh3><span style=\"{{ badge.card }}\">shown in switcher<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:var(--muted);margin:4px 0 0;max-width:760px;text-wrap:pretty\">One card per record in a responsive grid. Reach for it when each record deserves breathing room and the working set is small enough to browse rather than process.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"{{ ring.card }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px\">\n        <sc-for list=\"{{ records }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:15px 16px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n              <span style=\"font-family:var(--font-mono);font-size:13.5px;font-weight:600;letter-spacing:0.04em;color:var(--ink);background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:3px 8px\">{{ r.reg }}<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:{{ r.pillBg }};color:{{ r.pillFg }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ r.dotColor }}\"><\u002Fspan>{{ r.statusLabel }}<\u002Fspan>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:14.5px;font-weight:600;letter-spacing:-0.01em;line-height:1.25\">{{ r.vehicle }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--muted);margin-top:2px\">{{ r.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:9px;margin-top:1px\">\n              <span style=\"width:26px;height:26px;border-radius:50%;background:var(--accent-tint);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0\">{{ r.initials }}<\u002Fspan>\n              <span style=\"font-size:13px;color:var(--ink)\">{{ r.keeper }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid var(--border);margin-top:2px;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:8px\">\n              <span style=\"font-size:12px;color:var(--muted)\">{{ r.action }}<\u002Fspan>\n              <span class=\"tnum\" style=\"font-size:12px;color:var(--subtle)\">{{ r.date }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- A2 · LIST ROWS -->\n  <section style=\"margin-bottom:34px\">\n    <div style=\"display:flex;gap:13px;align-items:flex-start;margin-bottom:14px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:3px 8px;border-radius:6px\">A2<\u002Fspan>\n      <div style=\"flex:1\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><h3 style=\"font-size:16.5px;font-weight:600;letter-spacing:-0.01em;margin:0\">List rows<\u002Fh3><span style=\"{{ badge.list }}\">shown in switcher<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:var(--muted);margin:4px 0 0;max-width:760px;text-wrap:pretty\">Roomy single-line rows with a keeper avatar and inline meta. Reach for it for scannable browsing where each record still needs an identity and a little secondary context.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"{{ ring.list }}\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden\">\n        <sc-for list=\"{{ records }}\" as=\"r\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;align-items:center;gap:15px;padding:13px 18px;border-bottom:1px solid var(--border)\">\n            <span style=\"width:40px;height:40px;border-radius:50%;background:var(--accent-tint);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0\">{{ r.initials }}<\u002Fspan>\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"display:flex;align-items:center;gap:10px\">\n                <span style=\"font-family:var(--font-mono);font-size:13px;font-weight:600;letter-spacing:0.03em;color:var(--accent-ink)\">{{ r.reg }}<\u002Fspan>\n                <span style=\"font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.vehicle }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ r.keeper }} · {{ r.sub }}<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:{{ r.pillBg }};color:{{ r.pillFg }};flex-shrink:0\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ r.dotColor }}\"><\u002Fspan>{{ r.statusLabel }}<\u002Fspan>\n            <div style=\"width:150px;text-align:right;flex-shrink:0\">\n :1.5;color:var(--muted);margin:4px 0 0;max-width:760px;text-wrap:pretty\">Every field in its own sortable lane — click a column header to sort. Reach for it to filter, sort and compare across many records: the workhorse admin view.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"{{ ring.table }}\">\n      <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden\">\n        <div style=\"overflow-x:auto\">\n          <sc-for list=\"{{ sorted }}\" as=\"r\" hint-placeholder-count=\"10\">\n                <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;min-width:760px\">\n            <thead>\n              <tr>\n                <th onclick=\"{{ sorters.reg }}\" style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer\">Registration <span style=\"color:var(--subtle);font-weight:400\">{{ ind.reg }}<\u002Fspan><\u002Fth>\n                <th onclick=\"{{ sorters.keeper }}\" style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer\">Keeper <span style=\"color:var(--subtle);font-weight:400\">{{ ind.keeper }}<\u002Fspan><\u002Fth>\n                <th onclick=\"{{ sorters.vehicle }}\" style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer\">Vehicle <span style=\"color:var(--subtle);font-weight:400\">{{ ind.vehicle }}<\u002Fspan><\u002Fth>\n                <th onclick=\"{{ sorters.status }}\" style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer\">Status <span style=\"color:var(--subtle);font-weight:400\">{{ ind.status }}<\u002Fspan><\u002Fth>\n                <th onclick=\"{{ sorters.action }}\" style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer\">Last action <span style=\"color:var(--subtle);font-weight:400\">{{ ind.action }}<\u002Fspan><\u002Fth>\n                <th onclick=\"{{ sorters.date }}\" style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer\">Date <span style=\"color:var(--subtle);font-weight:400\">{{ ind.date }}<\u002Fspan><\u002Fth>\n              <\u002Ftr>\n            <\u002Fthead>\n            <tbody>\n              <tr style=\"border-bottom:1px solid var(--border)\">\n                  <td style=\"padding:9px 18px;height:var(--row-h);vertical-align:middle;white-space:nowrap\"><span style=\"font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:0.03em;color:var(--accent-ink)\">{{ r.reg }}<\u002Fspan><\u002Ftd>\n                  <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:13px\">{{ r.keeper }}<\u002Ftd>\n                  <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;max-width:240px\"><div style=\"font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis\">{{ r.vehicle }}<\u002Fdiv><div style=\"font-size:11.5px;color:var(--muted)\">{{ r.sub }}<\u002Fdiv><\u002Ftd>\n                  <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap\"><span style=\"display:inline-flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ r.dotColor }}\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:500;color:var(--muted)\">{{ r.statusLabel }}<\u002Fspan><\u002Fspan><\u002Ftd>\n                  <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:12.5px;color:var(--muted)\">{{ r.action }}<\u002Ftd>\n                  <td class=\"tnum\" style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:12.5px;color:var(--muted);text-align:right\">{{ r.date }}<\u002Ftd>\n                <\u002Ftr>\n              \n            <\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ PART B ============ -->\n  <div style=\"display:flex;align-items:baseline;gap:14px;margin:50px 0 6px;padding-top:34px;border-top:1px solid var(--border)\">\n    <span style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--accent-ink);background:var(--accent-tint);padding:4px 9px;border-radius:6px\">Part B<\u002Fspan>\n    <h2 style=\"font-size:21px;font-weight:600;letter-spacing:-0.015em;margin:0\">Density<\u002Fh2>\n    <span style=\"color:var(--subtle);font-size:13.5px\">— the data table at three row heights<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font-size:13.5px;line-height:1.55;color:var(--muted);max-width:760px;margin:14px 0 30px\">The same table from A4, three ways. Watch the row-height and padding trade-off: each step down fits more records on screen but trims the air a row needs to feel safe to act on.<\u002Fp>\n\n  <!-- B1 · COMFORTABLE -->\n  <section style=\"margin-bottom:34px\">\n    <div style=\"display:flex;gap:13px;align-items:flex-start;margin-bottom:14px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:3px 8px;border-radius:6px\">B1<\u002Fspa t-align:right\">{{ r.date }}<\u002Ftd>\n              <\u002Ftr>\n            \n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- B2 · COMPACT -->\n  <section style=\"margin-bottom:34px\">\n    <div style=\"display:flex;gap:13px;align-items:flex-start;margin-bottom:14px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:3px 8px;border-radius:6px\">B2<\u002Fspan>\n      <div style=\"flex:1\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><h3 style=\"font-size:16.5px;font-weight:600;letter-spacing:-0.01em;margin:0\">Compact<\u002Fh3><span style=\"font-size:11px;font-weight:500;color:var(--subtle);font-variant-numeric:tabular-nums\">~38px rows · default<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:var(--muted);margin:4px 0 0;max-width:760px;text-wrap:pretty\">Standard 38px admin rows, status as a quiet dot. Reach for it for everyday desk work — the DVLA default that balances density against legibility.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden\">\n      <div style=\"overflow-x:auto\">\n        <sc-for list=\"{{ records }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;min-width:760px\">\n          <thead><tr>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap\">Registration<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap\">Keeper<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap\">Vehicle<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap\">Status<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap\">Last action<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 18px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap\">Date<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr style=\"border-bottom:1px solid var(--border)\">\n                <td style=\"padding:9px 18px;height:38px;vertical-align:middle;white-space:nowrap\"><span style=\"font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:0.03em;color:var(--accent-ink)\">{{ r.reg }}<\u002Fspan><\u002Ftd>\n                <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:13px\">{{ r.keeper }}<\u002Ftd>\n                <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:13px;font-weight:500\">{{ r.vehicle }}<\u002Ftd>\n                <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap\"><span style=\"display:inline-flex;align-items:center;gap:7px\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ r.dotColor }}\"><\u002Fspan><span style=\"font-size:12.5px;font-weight:500;color:var(--muted)\">{{ r.statusLabel }}<\u002Fspan><\u002Fspan><\u002Ftd>\n                <td style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:12.5px;color:var(--muted)\">{{ r.action }}<\u002Ftd>\n                <td class=\"tnum\" style=\"padding:9px 18px;vertical-align:middle;white-space:nowrap;font-size:12.5px;color:var(--muted);text-align:right\">{{ r.date }}<\u002Ftd>\n              <\u002Ftr>\n            \n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- B3 · ULTRA-DENSE -->\n  <section style=\"margin-bottom:34px\">\n    <div style=\"display:flex;gap:13px;align-items:flex-start;margin-bottom:14px\">\n      <span style=\"font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-tint);padding:3px 8px;border-radius:6px\">B3<\u002Fspan>\n      <div style=\"flex:1\">\n        <div style=\"display:flex;align-items:center;gap:10px\"><h3 style=\"font-size:16.5px;font-weight:600;letter-spacing:-0.01em;margin:0\">Ultra-dense<\u002Fh3><span style=\"font-size:11px;font-weight:500;color:var(--subtle);font-variant-numeric:tabular-nums\">~26px rows<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:13px;line-height:1.5;color:var(--muted);margin:4px 0 0;max-width:760px;text-wrap:pretty\">Minimal padding, one line per record, vehicle trimmed to its model. Reach for it for power users scanning hundreds of records on large displays, where every saved row counts.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden\">\n      <div style=\"overflow-x:auto\">\n        <sc-for list=\"{{ records }}\" as=\"r\" hint-placeholder-count=\"10\">\n              <\u002Fsc-for><table style=\"width:100%;border-collapse:collapse;min-width:720px\">\n          <thead><tr>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px\">Reg<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px\">Keeper<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px\">Vehicle<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px\">Status<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:left;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px\">Last action<\u002Fth>\n            <th style=\"font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;color:var(--muted);text-align:right;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--border);white-space:nowrap;font-size:10px\">Date<\u002Fth>\n          <\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr style=\"border-bottom:1px solid var(--border)\">\n                <td style=\"padding:3px 12px;height:26px;vertical-align:middle;white-space:nowrap\"><span style=\"font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:0.02em;color:var(--accent-ink)\">{{ r.reg }}<\u002Fspan><\u002Ftd>\n                <td style=\"padding:3px 12px;vertical-align:middle;white-space:nowrap;font-size:12px\">{{ r.keeper }}<\u002Ftd>\n                <td style=\"padding:3px 12px;vertical-align:middle;white-space:nowrap;font-size:12px\">{{ r.vehicle }}<\u002Ftd>\n                <td style=\"padding:3px 12px;vertical-align:middle;white-space:nowrap\"><span style=\"display:inline-flex;align-items:center;gap:6px\"><span style=\"width:5px;height:5px;border-radius:50%;background:{{ r.dotColor }}\"><\u002Fspan><span style=\"font-size:11.5px;color:var(--muted)\">{{ r.statusLabel }}<\u002Fspan><\u002Fspan><\u002Ftd>\n                <td style=\"padding:3px 12px;vertical-align:middle;white-space:nowrap;font-size:11.5px;color:var(--muted)\">{{ r.action }}<\u002Ftd>\n                <td class=\"tnum\" style=\"padding:3px 12px;vertical-align:middle;white-space:nowrap;font-size:11.5px;color:var(--muted);text-align:right\">{{ r.date }}<\u002Ftd>\n              <\u002Ftr>\n            \n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"margin-top:46px;padding-top:20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;color:var(--subtle);font-size:12px\">\n    <svg width=\"14\" height=\"14\"><use href=\"#i-car\"><\u002Fuse><\u002Fsvg>\n    <span>Lookbook Specimens · cool-technical · one dataset across seven renders. Records are illustrative.<\u002Fspan>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { view: 'card', sortKey: 'date', sortDir: 'desc' };\n\n  base() {\n    return [\n      { reg: 'LR21 XKM', keeper: 'Margaret Okafor',  vehicle: 'Land Rover Discovery Sport', sub: 'HSE · 2.0 D180 Diesel',   status: 'taxed',   action: 'Keeper change',      date: '12 Jun 2026', ts: '2026-06-12' },\n      { reg: 'BD68 ZTV', keeper: 'Tomasz Kowalski',  vehicle: 'Ford Transit Custom',         sub: '320 L2 H1 · Diesel',     status: 'sorn',    action: 'SORN declared',      date: '09 Jun 2026', ts: '2026-06-09' },\n      { reg: 'YK19 HNP', keeper: 'Priya Nair',       vehicle: 'Toyota Corolla',              sub: '1.8 Hybrid · Petrol',    status: 'taxed',   action: 'V5C issued',         date: '30 May 2026', ts: '2026-05-30' },\n      { reg: 'RF15 OWE', keeper: 'Gareth Pryce',     vehicle: 'Vauxhall Astra',              sub: 'SRi 1.4T · Petrol',      status: 'motdue',  action: 'MOT reminder sent',  date: '28 May 2026', ts: '2026-05-28' },\n      { reg: 'EJ70 MCA', keeper: 'Aisha Rahman',     vehicle: 'Tesla Model 3',               sub: 'Long Range · Electric',  status: 'taxed',   action: 'First registration', date: '24 May 2026', ts: '2026-05-24' },\n      { reg: 'CP64 LDX', keeper: 'Stephen Buchanan', vehicle: 'BMW 320d',                     sub: 'M Sport · Diesel',       status: 'untaxed', action: 'Enforcement flagged',date: '21 May 2026', ts: '2026-05-21' },\n      { reg: 'WG18 TRB', keeper: 'Fiona Campbell',   vehicle: 'Nissan Qashqai',              sub: 'N-Connecta · Petrol',    status: 'taxed',   action: 'Address updated',    date: '18 May 2026', ts: '2026-05-18' },\n      { reg: 'HV12 ASN', keeper: 'Daniel Mensah',    vehicle: 'Volkswagen Golf',             sub: 'GT TDI · Diesel',        status: 'sorn',    action: 'SORN declared',      date: '14 May 2026', ts: '2026-05-14' },\n      { reg: 'MK67 DPL', keeper: 'Eleni Georgiou',   vehicle: 'Audi A4 Avant',               sub: '40 TFSI · Petrol',       status: 'motdue',  action: 'MOT reminder sent',  date: '11 May 2026', ts: '2026-05-11' },\n      { reg: 'SA20 VNR', keeper: 'Owen Roberts',     vehicle: 'Kia Sportage',                sub: 'GT-Line · Hybrid',       status: 'taxed',   action: 'Keeper change',      date: '06 May 2026', ts: '2026-05-06' }\n    ];\n  }\n\n  meta(s) {\n    return {\n      taxed:   { dot: 'var(--positive)', label: 'Taxed',   bg: 'rgba(26,127,75,0.10)',  fg: '#15673B' },\n      sorn:    { dot: 'var(--subtle)',   label: 'SORN',    bg: 'rgba(107,114,128,0.10)', fg: '#565D6A' },\n      motdue:  { dot: 'var(--warning)',  label: 'MOT due', bg: 'rgba(183,121,31,0.12)', fg: '#92600A' },\n      untaxed: { dot: 'var(--danger)',   label: 'Untaxed', bg: 'rgba(200,65,46,0.10)',  fg: '#B0362A' }\n    }[s];\n  }\n\n  enrich(r) {\n    const m = this.meta(r.status);\n    const initials = r.keeper.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();\n    return { ...r, dotColor: m.dot, statusLabel: m.label, pillBg: m.bg, pillFg: m.fg, initials };\n  }\n\n  doSort(k) {\n    this.setState(s => s.sortKey === k\n      ? { sortDir: s.sortDir === 'asc' ? 'desc' : 'asc' }\n      : { sortKey: k, sortDir: 'asc' });\n  }\n\n  renderVals() {\n    const recs = this.base().map(r => this.enrich(r));\n    const { sortKey, sortDir, view } = this.state;\n\n    const sorted = [...recs].sort((a, b) => {\n      let av, bv;\n      if (sortKey === 'date') { av = a.ts; bv = b.ts; }\n      else { av = String(a[sortKey]).toLowerCase(); bv = String(b[sortKey]).toLowerCase(); }\n      if (av < bv) return sortDir === 'asc' ? -1 : 1;\n      if (av > bv) return sortDir === 'asc' ? 1 : -1;\n      return 0;\n    });\n\n    const arrow = sortDir === 'asc' ? '↑' : '↓';\n    const cols = ['reg', 'keeper', 'vehicle', 'status', 'action', 'date'];\n    const ind = {}, sorters = {};\n    cols.forEach(c => { ind[c] = sortKey === c ? arrow : '↕'; sorters[c] = () => this.doSort(c); });\n\n    const segBase = { display: 'inline-flex', alignItems: 'center', gap: '7px', padding: '7px 13px', borderRadius: '6px', fontSize: '12.5px', fontWeight: 600, cursor: 'pointer', border: 'none', background: 'transparent', color: 'var(--muted)', whiteSpace: 'nowrap', transition: 'all 140ms cubic-bezier(0.2,0,0,1)' };\n    const segOn = { ...segBase, background: 'var(--surface)', color: 'var(--accent-ink)', boxShadow: '0 1px 2px rgba(16,18,29,0.12)' };\n    const badgeOn = { display: 'inline-flex', alignItems: 'center', gap: '5px', fontSize: '10px', fontWeight: 600, letterSpacing: '0.05em', textTransform: 'uppercase', color: 'var(--accent-ink)', background: 'var(--accent-tint)', padding: '3px 8px', borderRadius: '999px' };\n\n    const views = ['card', 'list', 'compact', 'table'];\n    const seg = {}, setView = {}, ring = {}, badge = {};\n    views.forEach(v => {\n      const on = view === v;\n      seg[v] = on ? segOn : segBase;\n      setView[v] = () => this.setState({ view: v });\n      ring[v] = on\n        ? { borderRadius: '13px', boxShadow: '0 0 0 1.5px var(--accent)', padding: '3px', margin: '-3px' }\n        : { borderRadius: '13px' };\n      badge[v] = on ? badgeOn : { display: 'none' };\n    });\n\n    return { records: recs, sorted, ind, sorters, seg, setView, ring, badge, view };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
