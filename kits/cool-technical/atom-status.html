<!DOCTYPE html>
<html lang="en">
<!--
  MOLECULE M5 — status · register: cool-technical
  Distilled from how real shipped products (Linear issue states, Stripe payment
  statuses, Vercel deploy states) encode state: a quiet 8px dot + text, OR a low-chroma
  tint pill with ink-on-tint text — never a full-saturation badge. Single-channel color
  + always paired with a text label (no color-only encoding). Satisfies MC-7, AD-9; and
  honors the brain's AP23 (no double-encoding) — pick dot OR pill, not both decoratively.
  Variants: (A) dot + label (lowest-chroma, best in dense tables) · (B) tint pill (more
  presence, best standalone / in headers). CONFIRM vs live: dot size, pill tint alpha.
-->
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M5 status — cool-technical</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;
       -webkit-font-smoothing:antialiased;padding:40px}
  .specimen{max-width:680px;margin:0 auto}
  .specimen + .specimen{margin-top:44px}
  .label{font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;
         color:var(--subtle);margin-bottom:14px;display:block}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}

  /* semantic ramp (single channel, low-chroma) */
  :root{
    --st-ok:var(--positive); --st-ok-tint:rgba(26,127,75,0.10);
    --st-warn:var(--warning); --st-warn-tint:rgba(183,121,31,0.12);
    --st-idle:#6B7280;        --st-idle-tint:rgba(107,114,128,0.10);
    --st-bad:var(--danger);   --st-bad-tint:rgba(200,65,46,0.10);
    --st-info:var(--accent);  --st-info-tint:var(--accent-tint);
  }

  /* Variant A — dot + label */
  .dotstat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500}
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dotstat.ok{color:var(--st-ok)}    .dot.ok{background:var(--st-ok)}
  .dotstat.warn{color:var(--st-warn)}.dot.warn{background:var(--st-warn)}
  .dotstat.idle{color:var(--st-idle)}.dot.idle{background:var(--st-idle)}
  .dotstat.bad{color:var(--st-bad)}  .dot.bad{background:var(--st-bad)}
  .dotstat.info{color:var(--st-info)}.dot.info{background:var(--st-info)}

  /* Variant B — tint pill (ink-on-tint, not white-on-saturated) */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
        padding:3px 9px;border-radius:999px;line-height:1.4}
  .pill .pd{width:6px;height:6px;border-radius:50%}
  /* pill text uses a darker tonal step than the dot — ink-on-tint needs >=4.5 (F66) */
  .pill.ok{background:var(--st-ok-tint);color:#15673B}          .pill.ok .pd{background:var(--st-ok)}
  .pill.warn{background:var(--st-warn-tint);color:var(--st-warn)}.pill.warn .pd{background:var(--st-warn)}
  .pill.idle{background:var(--st-idle-tint);color:#565D6A}      .pill.idle .pd{background:var(--st-idle)}
  .pill.bad{background:var(--st-bad-tint);color:#B0362A}        .pill.bad .pd{background:var(--st-bad)}
  .pill.info{background:var(--st-info-tint);color:var(--accent-ink)}.pill.info .pd{background:var(--accent)}
</style>
</head>
<body>

  <div class="specimen">
    <span class="label">Variant A — dot + label (dense tables, lowest chroma)</span>
    <div class="row">
      <span class="dotstat ok"><span class="dot ok"></span>Ready</span>
      <span class="dotstat warn"><span class="dot warn"></span>Building</span>
      <span class="dotstat idle"><span class="dot idle"></span>Queued</span>
      <span class="dotstat bad"><span class="dot bad"></span>Error</span>
      <span class="dotstat info"><span class="dot info"></span>In review</span>
    </div>
  </div>

  <div class="specimen">
    <span class="label">Variant B — tint pill, ink-on-tint (standalone / headers)</span>
    <div class="row">
      <span class="pill ok"><span class="pd"></span>Paid</span>
      <span class="pill warn"><span class="pd"></span>Pending</span>
      <span class="pill idle"><span class="pd"></span>Draft</span>
      <span class="pill bad"><span class="pd"></span>Failed</span>
      <span class="pill info"><span class="pd"></span>Processing</span>
    </div>
  </div>

</body>
</html>
