<!DOCTYPE html>
<html lang="en">
<!--
  ATOMS — figures · register: cool-technical
  The taste-bearing TREATMENTS for numeric display, re-atomized out of the old M2-KPI
  (see KIT.md §0.5). A figure atom dictates only HOW one number LOOKS — never where it
  sits relative to others. Arrangement is a recipe's job (recipe-figure.html).
  Distilled from how real shipped products (Stripe overview, Mercury/Ramp figures,
  Vercel analytics) treat metrics: confident tabular figure, negative tracking, uppercase
  muted eyebrow, quiet semantic delta. Satisfies T-1, T-3, T-4, T-5, DM-5, MC-7.
  Two atoms:
    .hero-figure — the headline number (DM-5). 32–40px (standalone hero ≤44px).
    .stat        — a supporting number. 20–26px.
  Both share the eyebrow + figure + delta primitives, so they're coherent by construction.
  CONFIRM vs live: hero size 32–40px (≤44 standalone), stat size (20–26px), delta chroma, eyebrow tracking.
-->
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Figure atoms — cool-technical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);
       font-size:14px;-webkit-font-smoothing:antialiased;padding:40px}
  .specimen{max-width:880px;margin:0 auto}
  .specimen + .specimen{margin-top:48px}
  .label{font:var(--t-eyebrow);letter-spacing:var(--tr-eyebrow);text-transform:uppercase;
         color:var(--subtle);margin-bottom:12px;display:block}
  .card{background:var(--surface);border:var(--border-w) solid var(--border);
        border-radius:var(--radius-lg);padding:26px 28px}

  /* ---- shared primitives (the coherence) ---- */
  .eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .figure{font-weight:600;letter-spacing:var(--tr-figure);line-height:1.04;color:var(--ink);
          font-variant-numeric:tabular-nums}
  .delta{display:inline-flex;align-items:center;gap:3px;font-weight:600;font-variant-numeric:tabular-nums}
  .delta.up{color:var(--positive)} .delta.down{color:var(--danger)}
  .delta-note{color:var(--muted);font-weight:400}

  /* ---- ATOM: hero-figure ---- */
  .hero-figure .eyebrow{margin-bottom:8px}
  .hero-figure .figure{font-size:34px}
  .hero-figure .delta-row{display:flex;align-items:baseline;gap:8px;margin-top:8px;font-size:13px}

  /* ---- ATOM: stat ---- */
  .stat .eyebrow{font-size:10.5px;margin-bottom:5px}
  .stat .figure{font-size:22px}
  .stat .delta{font-size:11.5px;margin-top:3px}
</style>
</head>
<body>

  <div class="specimen">
    <span class="label">Atom — hero-figure (the headline number, DM-5)</span>
    <div class="card hero-figure">
      <div class="eyebrow">Today's revenue</div>
      <div class="figure">$8,341.50</div>
      <div class="delta-row">
        <span class="delta up">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8L5.5 3L9 8"/></svg>
          +24.7%
        </span>
        <span class="delta-note">vs yesterday</span>
      </div>
    </div>
  </div>

  <div class="specimen">
    <span class="label">Atom — stat (the supporting number)</span>
    <div class="card" style="display:flex;gap:44px">
      <div class="stat"><div class="eyebrow">Orders</div><div class="figure">147</div><div class="delta up">↑ 18 vs yesterday</div></div>
      <div class="stat"><div class="eyebrow">Avg order value</div><div class="figure">$56.74</div><div class="delta up">↑ 4.1%</div></div>
      <div class="stat"><div class="eyebrow">Conversion</div><div class="figure">4.2%</div><div class="delta down">↓ 0.2%</div></div>
      <div class="stat"><div class="eyebrow">Refunds</div><div class="figure">3</div><div class="delta-note" style="font-size:12px;margin-top:3px">$82.50 total</div></div>
    </div>
  </div>

</body>
</html>
